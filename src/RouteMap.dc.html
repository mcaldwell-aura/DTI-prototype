<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Route map</title>

</head>
<body>
<x-dc>
<helmet>


</helmet>
<div role="img" aria-label="Map of test route West Loop A with 11 evaluation points" style="position: relative; width: {{w}}px; height: {{h}}px; overflow: hidden; background-color: #ECEEE8; background-image: repeating-linear-gradient(0deg, transparent 0 46px, #E1E4DC 46px 48px), repeating-linear-gradient(90deg, transparent 0 46px, #E1E4DC 46px 48px); font-family: var(--font-sans); color: var(--color-charcoal)">
  <div style="position: absolute; left: 47%; top: 33%; width: 17%; height: 13%; background: #D3E5CC; border-radius: 8px"></div>
  <div style="position: absolute; left: 49%; top: 37%; font-size: 11px; font-weight: 600; color: #3F6B37">Park</div>
  <div style="position: absolute; left: 24%; top: 88%; width: 10%; height: 7%; background: #D3E5CC; border-radius: 8px"></div>

  <div style="position: absolute; left: 0; right: 0; top: calc(30% - 5px); height: 10px; background: var(--color-white); border-top: 1px solid var(--color-map-line); border-bottom: 1px solid var(--color-map-line)"></div>
  <div style="position: absolute; left: 0; right: 0; top: calc(52.5% - 5px); height: 10px; background: var(--color-white); border-top: 1px solid var(--color-map-line); border-bottom: 1px solid var(--color-map-line)"></div>
  <div style="position: absolute; left: 0; right: 0; top: calc(72.5% - 5px); height: 10px; background: var(--color-white); border-top: 1px solid var(--color-map-line); border-bottom: 1px solid var(--color-map-line)"></div>
  <div style="position: absolute; left: 0; right: 0; top: calc(85% - 5px); height: 10px; background: var(--color-white); border-top: 1px solid var(--color-map-line); border-bottom: 1px solid var(--color-map-line)"></div>
  <div style="position: absolute; top: 0; bottom: 0; left: calc(18% - 5px); width: 10px; background: var(--color-white); border-left: 1px solid var(--color-map-line); border-right: 1px solid var(--color-map-line)"></div>
  <div style="position: absolute; top: 0; bottom: 0; left: calc(42% - 5px); width: 10px; background: var(--color-white); border-left: 1px solid var(--color-map-line); border-right: 1px solid var(--color-map-line)"></div>
  <div style="position: absolute; top: 0; bottom: 0; left: calc(70% - 5px); width: 10px; background: var(--color-white); border-left: 1px solid var(--color-map-line); border-right: 1px solid var(--color-map-line)"></div>
  <div style="position: absolute; top: 0; bottom: 0; left: calc(82% - 5px); width: 10px; background: var(--color-white); border-left: 1px solid var(--color-map-line); border-right: 1px solid var(--color-map-line)"></div>

  <div style="position: absolute; left: 21%; top: calc(30% - 22px); font-size: 11px; font-weight: 600; color: var(--color-slate-muted)">W Indian School Rd</div>
  <div style="position: absolute; left: 50%; top: calc(52.5% - 22px); font-size: 11px; font-weight: 600; color: var(--color-slate-muted)">W Thomas Rd</div>
  <div style="position: absolute; left: 21%; top: calc(72.5% - 22px); font-size: 11px; font-weight: 600; color: var(--color-slate-muted)">W McDowell Rd</div>
  <div style="position: absolute; left: 50%; top: calc(85% - 22px); font-size: 11px; font-weight: 600; color: var(--color-slate-muted)">W Van Buren St</div>
  <div style="position: absolute; left: calc(18% + 9px); top: 3%; font-size: 11px; font-weight: 600; color: var(--color-slate-muted)">N 51st Ave</div>
  <div style="position: absolute; left: calc(42% + 9px); top: 3%; font-size: 11px; font-weight: 600; color: var(--color-slate-muted)">N 43rd Ave</div>
  <div style="position: absolute; left: calc(70% + 9px); top: 3%; font-size: 11px; font-weight: 600; color: var(--color-slate-muted)">N 35th Ave</div>
  <div style="position: absolute; left: calc(82% + 9px); top: 3%; font-size: 11px; font-weight: 600; color: var(--color-slate-muted)">N 27th Ave</div>

  <svg viewBox="0 0 1000 800" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
    <path d="M180 640 L180 420 L420 420 L420 240 L700 240 L700 420 L820 420 L820 580 L400 580 L400 680 L180 680 L180 640" fill="none" stroke="var(--color-white)" stroke-width="11" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
    <path d="M180 640 L180 420 L420 420 L420 240 L700 240 L700 420 L820 420 L820 580 L400 580 L400 680 L180 680 L180 640" fill="none" stroke="var(--color-indigo)" stroke-width="6" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
  </svg>

  <div style="position: absolute; left: 7%; top: 77%; display: flex; align-items: center; gap: var(--space-6); padding: var(--space-4) var(--space-8); background: var(--color-charcoal); color: var(--color-white); border-radius: 6px; font-size: 11px; font-weight: 600">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--color-white)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l7-4 7 4v13"></path></svg>
    MVD
  </div>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="11">
    <div style="{{p.style}}">{{p.n}}</div>
  </sc-for>

  <sc-if value="{{showCallout}}" hint-placeholder-val="{{ true }}">
    <div style="{{calloutStyle}}">
      <div style="font-size: 11px; font-weight: 600; color: var(--color-amber); text-transform: uppercase; letter-spacing: 0.05em">Point {{active}} · now</div>
      <div style="font-size: 14px; font-weight: 700">{{activeLabel}}</div>
    </div>
  </sc-if>

  <sc-if value="{{showVehicleDot}}" hint-placeholder-val="{{ true }}">
    <div style="{{vehicleStyle}}"></div>
  </sc-if>

  <div style="position: absolute; left: 12px; bottom: 12px; display: flex; gap: var(--space-14); align-items: center; padding: var(--space-8) var(--space-12); background: var(--color-white); border-radius: 10px; box-shadow: 0 1px 4px rgba(20,24,29,0.15); font-size: 12px; color: var(--color-charcoal-light)">
    <span style="display: flex; align-items: center; gap: var(--space-6)"><span style="width: var(--space-12); height: 12px; border-radius: 50%; background: var(--color-indigo)"></span>Done</span>
    <span style="display: flex; align-items: center; gap: var(--space-6)"><span style="width: var(--space-12); height: 12px; border-radius: 50%; background: var(--color-orange); border: 2px solid var(--color-charcoal); box-sizing: border-box"></span>Current</span>
    <span style="display: flex; align-items: center; gap: var(--space-6)"><span style="width: var(--space-12); height: 12px; border-radius: 50%; background: var(--color-white); border: 2px solid var(--color-indigo); box-sizing: border-box"></span>Upcoming</span>
  </div>

  <div style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: var(--space-6)">
    <button aria-label="Re-center on vehicle" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: var(--color-white); box-shadow: 0 1px 4px rgba(20,24,29,0.15); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-indigo)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"int","default":4,"min":0,"max":11},"showVehicle":{"editor":"boolean","default":true},"w":{"editor":null,"default":760},"h":{"editor":null,"default":600},"$preview":{"width":760,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const active = Number(this.props.active ?? 4);
    const showVehicle = this.props.showVehicle ?? true;
    const pts = [
      [180, 640, 'Start · leave lot'], [180, 420, 'Right turn at signal'], [420, 420, 'Left turn'],
      [420, 320, 'Stop sign'], [560, 240, 'Lane change'], [700, 330, 'School zone'],
      [820, 420, 'Right turn'], [820, 580, 'Right turn'], [600, 580, '4-way stop'],
      [400, 680, 'Left turn'], [180, 680, 'Return and park']
    ];
    const pins = pts.map((p, i) => {
      const n = i + 1;
      const isActive = n === active;
      const done = active > 0 && n < active;
      const size = isActive ? 40 : 28;
      const bg = isActive ? 'var(--color-orange)' : (done ? 'var(--color-indigo)' : 'var(--color-white)');
      const fg = isActive ? 'var(--color-charcoal)' : (done ? 'var(--color-white)' : 'var(--color-indigo)');
      const border = isActive ? 'var(--color-charcoal)' : 'var(--color-indigo)';
      const shadow = isActive ? '0 0 0 7px rgba(229,154,43,0.35)' : '0 1px 3px rgba(20,24,29,0.25)';
      return {
        n,
        style: 'position: absolute; left: ' + (p[0] / 10) + '%; top: ' + (p[1] / 8) + '%; transform: translate(-50%, -50%); width: ' + size + 'px; height: ' + size + 'px; box-sizing: border-box; border-radius: 50%; background: ' + bg + '; color: ' + fg + '; border: 2px solid ' + border + '; box-shadow: ' + shadow + '; display: flex; align-items: center; justify-content: center; font: 600 ' + (isActive ? 15 : 12) + 'px \'IBM Plex Mono\', monospace; z-index: ' + (isActive ? 4 : 2)
      };
    });
    const cur = active > 0 ? pts[active - 1] : null;
    const calloutStyle = cur ? 'position: absolute; left: calc(' + (cur[0] / 10) + '% + 30px); top: ' + (cur[1] / 8) + '%; transform: translateY(-50%); background: var(--color-white); border: 1px solid var(--color-amber-border); border-radius: 10px; padding: var(--space-8) var(--space-12); box-shadow: 0 2px 8px rgba(20,24,29,0.15); z-index: 5; white-space: nowrap' : '';
    let vehicleStyle = '';
    if (active >= 2) {
      const prev = pts[active - 2];
      const vx = prev[0] + (cur[0] - prev[0]) * 0.55;
      const vy = prev[1] + (cur[1] - prev[1]) * 0.55;
      vehicleStyle = 'position: absolute; left: ' + (vx / 10) + '%; top: ' + (vy / 8) + '%; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: #1D63D8; border: 3px solid var(--color-white); box-shadow: 0 0 0 8px rgba(29,99,216,0.22); z-index: 3';
    }
    return {
      w: this.props.w ?? 760,
      h: this.props.h ?? 600,
      pins, active,
      activeLabel: cur ? cur[2] : '',
      showCallout: !!cur,
      calloutStyle,
      showVehicleDot: showVehicle && active >= 2,
      vehicleStyle
    };
  }
}
</script>
</body>
</html>
