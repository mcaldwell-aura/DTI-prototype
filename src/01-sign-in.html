<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>DTI Examiner – Sign in</title>
<script src="shared/runtime.js"></script>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: var(--font-sans); color: var(--color-charcoal); background: var(--color-background); box-sizing: border-box">
  <section style="width: 560px; height: 800px; box-sizing: border-box; background: var(--color-indigo-dark); color: var(--color-white); padding: 56px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
    <svg sc-camel-view-box="0 0 560 800" style="position: absolute; inset: 0; width: 560px; height: 800px" aria-hidden="true">
      <path d="M120 760 L120 520 L300 520 L300 380 L470 380 L470 600 L620 600" fill="none" stroke="var(--color-white)" stroke-opacity="0.10" stroke-width="10" stroke-linejoin="round"></path>
      <circle cx="120" cy="520" r="14" fill="var(--color-white)" fill-opacity="0.12"></circle>
      <circle cx="300" cy="380" r="14" fill="var(--color-white)" fill-opacity="0.12"></circle>
      <circle cx="470" cy="600" r="20" fill="var(--color-orange)" fill-opacity="0.85"></circle>
    </svg>
    <div style="display: flex; align-items: center; gap: var(--space-12); position: relative">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-white); display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="var(--color-indigo)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      </div>
      <div style="font-weight: 700; font-size: 18px">DTI Examiner</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: var(--space-20); position: relative">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #C9CEF0">Driving Test Intelligence</div>
      <h1 style="margin: 0; font-size: 44px; line-height: 1.1; font-weight: 700">Route-aware road tests. The examiner makes every call.</h1>
    </div>
    <div aria-hidden="true"></div>
  </section>
  <section style="flex: 1; display: flex; align-items: center; justify-content: center">
    <form sc-camel-on-submit="{{logIn}}" style="width: 440px; background: var(--color-white); border: 1px solid var(--color-line); border-radius: 16px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-24)">
      <div>
        <h2 style="margin: 0; font-size: 26px; font-weight: 700">Welcome Back</h2>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-8)">
        <label for="email" style="font-size: var(--space-14); font-weight: 600">Email</label>
        <input id="email" type="email" autocomplete="username" required style="height: 52px; box-sizing: border-box; border: 1px solid var(--color-line-dark); border-radius: 10px; padding: 0 var(--space-14); font: 500 16px var(--font-sans); color: var(--color-charcoal); background: var(--color-white)">
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-8)">
        <label for="password" style="font-size: var(--space-14); font-weight: 600">Password</label>
        <input id="password" type="password" autocomplete="current-password" required style="height: 52px; box-sizing: border-box; border: 1px solid var(--color-line-dark); border-radius: 10px; padding: 0 var(--space-14); font: 500 16px var(--font-sans); color: var(--color-charcoal); background: var(--color-white)">
      </div>
      <button type="submit" style="height: 56px; border: none; border-radius: 10px; background: var(--color-indigo); color: var(--color-white); display: flex; align-items: center; justify-content: center; font: 600 16px var(--font-sans); cursor: pointer">Sign In</button>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    return {
      logIn: (event) => {
        event.preventDefault();
        window.location.href = '01a-entra-account.html';
      }
    };
  }
}
</script>



<style id="screen-fit-style">html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e5e7eb; }
body > x-dc, body > #dc-root { display: block; position: absolute; width: 1280px; height: 800px; transform-origin: top left; }</style>
<script id="screen-fit-script">
(() => {
  function fit() {
    const root = document.querySelector("body > #dc-root, body > x-dc");
    if (!root) return;
    const scale = Math.max(0, Math.min((window.innerWidth - 32) / 1280, (window.innerHeight - 32) / 800));
    root.style.transform = "scale(" + scale + ")";
    root.style.left = (window.innerWidth - 1280 * scale) / 2 + "px";
    root.style.top = (window.innerHeight - 800 * scale) / 2 + "px";
  }
  window.addEventListener("resize", fit);
  new MutationObserver(fit).observe(document.body, { childList: true });
  fit();
})();
</script>
</body></html>
